name: Release

# Builds the Windows installer of a version tag into a draft GitHub Release,
# checks its signed update the way installed Tinto will read it, and only then
# publishes the release, which every installed Tinto picks up. It is started
# for a tag already pushed, by hand (`gh workflow run release.yml --ref develop
# -f tag=vX.Y.Z`) or by the Release cut workflow. It does not run on the tag
# push itself: a run on a tag saves its Rust caches under that tag, where no
# later release can read them, so every release would build from scratch. Run
# on develop, each release restores the previous one's. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The vX.Y.Z tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

# Every job builds with one pinned Rust: a newer stable can bring lints that
# fail a release halfway. Check locally with the same one before tagging.

jobs:
  # Runs beside the builds, on Linux (faster than a Windows runner), and gates
  # the publish, not the build: a failure leaves an unpublished draft.
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Lint and frontend tests
        run: |
          npm run lint
          npm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  wsl-agent:
    name: WSL agent
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Build WSL agent
        working-directory: src-tauri
        run: |
          cargo build --release --bin tinto-agent
          cp target/release/tinto-agent ../tinto-agent-linux-x86_64

      - name: Upload WSL agent
        uses: actions/upload-artifact@v7
        with:
          name: tinto-agent-linux-x86_64
          path: tinto-agent-linux-x86_64
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    needs: wsl-agent
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "$TAG" || { echo "tag $TAG, app $version"; exit 1; }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Download WSL agent
        uses: actions/download-artifact@v8
        with:
          name: tinto-agent-linux-x86_64
          path: src-tauri/resources

      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_END"
            node scripts/release.mjs notes "$TAG"
            echo "NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # Authenticode, once a certificate is in the repo's secrets: without it
      # the installer is unsigned and Windows SmartScreen warns about it.
      - name: Code signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = Get-Content src-tauri/tauri.release.conf.json -Raw | ConvertFrom-Json
          $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.release.conf.json

      - name: Build into a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Tinto ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          args: --config src-tauri/tauri.release.conf.json

  # What installed Tinto will download, checked on the draft before anyone can
  # see it: latest.json names this version, newer than the published one, has
  # windows-x86_64, points at this release's assets, and each signature
  # verifies with the app's updater key over the uploaded bytes. A failure
  # leaves the draft for you to inspect or delete. It does not install and run
  # an update (see RELEASING.md), so it runs on Linux: the check is Node only.
  update-check:
    name: Check update and publish
    runs-on: ubuntu-latest
    needs:
      - checks
      - windows
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download the draft and the published update
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/draft"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq .assets \
            > "$RUNNER_TEMP/assets.json"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json \
            --output "$RUNNER_TEMP/published-latest.json"

      - name: Check the update
        run: |
          node scripts/check-update.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/draft" --assets "$RUNNER_TEMP/assets.json" \
            --previous "$RUNNER_TEMP/published-latest.json"

      - name: Publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
