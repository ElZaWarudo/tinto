name: Release cut

# Cuts a release from the Actions tab: takes the next version after the latest
# stable tag, refuses unless CI passed on the ref, bumps every manifest and adds
# the CHANGELOG.md section (scripts/release.mjs), then commits
# "chore(release): vX.Y.Z" on the ref, tags it and pushes both. A tag pushed
# with GITHUB_TOKEN triggers no other workflow, so this calls the Release
# workflow itself to build, check and publish. A dry run (the default) prints
# the plan and pushes nothing. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      rc:
        description: Release candidate (vX.Y.Z-rc.N, published as a prerelease)
        type: boolean
        default: false
      ref:
        description: Branch to release
        type: string
        default: develop
      dry_run:
        description: Dry run (print the plan, push nothing)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    env:
      KIND: ${{ inputs.kind }}
      RC: ${{ inputs.rc }}
      REF: ${{ inputs.ref }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: CI passed on the ref
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$sha" --event push --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          echo "CI on $REF ($sha): $conclusion"
          test "$conclusion" = success || { echo "::error::CI has not passed on $sha"; exit 1; }

      - name: Bump, changelog, commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--kind "$KIND")
          if [ "$RC" = true ]; then args+=(--rc); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/release.mjs "${args[@]}"

      - name: Push the commit and the tag
        id: push
        if: inputs.dry_run == false
        run: |
          git ls-remote --exit-code --heads origin "$REF" > /dev/null \
            || { echo "::error::$REF is not a branch"; exit 1; }
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # Atomic: if the branch moved since checkout, neither is pushed.
          git push --atomic origin "HEAD:refs/heads/$REF" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: cut
    if: inputs.dry_run == false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
