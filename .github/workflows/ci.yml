name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITLEAKS_VERSION: "8.30.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --output checksums.txt \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks

      - name: Scan Git history
        run: ./gitleaks git --no-banner --redact=100 --verbose .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated bus contract
        run: npm run contract:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build
        working-directory: src-tauri
        run: cargo build

      - name: Build WSL agent artifact
        working-directory: src-tauri
        run: |
          cargo build --release --bin tinto-agent
          cp target/release/tinto-agent ../tinto-agent-linux-x86_64

      - name: Upload WSL agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinto-agent-linux-x86_64
          path: tinto-agent-linux-x86_64
          if-no-files-found: error

  tauri-bundle:
    name: Tauri bundle
    runs-on: ubuntu-22.04
    needs:
      - frontend
      - rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Download WSL agent resource
        uses: actions/download-artifact@v4
        with:
          name: tinto-agent-linux-x86_64
          path: src-tauri/resources

      - name: Verify WSL agent resource
        run: test -f src-tauri/resources/tinto-agent-linux-x86_64

      - name: Build Tauri bundle
        run: npm run tauri build

  tauri-windows-bundle:
    name: Tauri Windows bundle
    runs-on: windows-latest
    needs:
      - frontend
      - rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Download WSL agent resource
        uses: actions/download-artifact@v4
        with:
          name: tinto-agent-linux-x86_64
          path: src-tauri/resources

      - name: Verify WSL agent resource
        shell: powershell
        run: |
          if (!(Test-Path src-tauri/resources/tinto-agent-linux-x86_64)) {
            throw "Missing WSL agent resource"
          }

      - name: Build Tauri Windows bundle
        run: npm run tauri build

      - name: Upload Windows bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinto-windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
