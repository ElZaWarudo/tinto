[package]
name = "tinto"
version = "0.1.0"
description = "Monitoreo read-only de repos git editados por agentes de codigo"
authors = ["Mayor"]
edition = "2021"
default-run = "tinto"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tinto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tinto"
path = "src/main.rs"

[[bin]]
name = "tinto-agent"
path = "src/bin/tinto-agent.rs"

[features]
default = []
e2e-wdio = ["dep:tauri-plugin-wdio-webdriver"]
# <pumarejo:cargo-feature-created>
pumarejo = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol-schema = { version = "=1.7.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
# Utilidades async sobre el runtime tokio que Tauri ya trae (tauri::async_runtime).
# El watcher usa: time (debounce/throttle), sync (canal mpsc), macros (select!), rt (spawn).
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
# Watcher de FS nativo multiplataforma (inotify / ReadDirectoryChangesW)
notify = "8"
portable-pty = "0.9.0"
uuid = { version = "1", features = ["v4"] }
which = "6"
# Capa de lectura de git: libgit2 vendored (build estático, sin red — no se necesitan
# features ssh/https porque Tinto nunca hace fetch/push)
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
thiserror = "2"
# Clasificación de paths: reglas .gitignore (crate de ripgrep) + globs de watchlist
ignore = "0.4"
globset = "0.4"
# Contenido binario de FileContent en el contrato del bus
base64 = "0.22"
# Persistencia de workbenches: TOML en el config dir del SO
toml = "1.1"
dirs = "6"
walkdir = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.1"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# start_paused/advance para tests deterministas del debounce (reloj pausado)
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
