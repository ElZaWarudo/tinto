[package]
name = "tinto"
version = "0.1.0"
description = "Monitoreo read-only de repos git editados por agentes de codigo"
authors = ["Mayor"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tinto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Utilidades async sobre el runtime tokio que Tauri ya trae (tauri::async_runtime)
tokio = { version = "1", features = ["time"] }
# Capa de lectura de git: libgit2 vendored (build estático, sin red — no se necesitan
# features ssh/https porque Tinto nunca hace fetch/push)
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
thiserror = "2"
# Clasificación de paths: reglas .gitignore (crate de ripgrep) + globs de watchlist
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

